#      build_id: "${{ inputs.build_id }}"
#      devices: "glymur-crd,qrb2210-rb1,qrb2210-arduino-imola"
#      devices_premerge: "glymur-crd,qrb2210-rb1,qrb2210-arduino-imola"
#      project_name: "qcom-deb-images"
#      distro_name: "debian"
#      os_info: "debian"
#      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
#      lava_test_plans_repository: "${{ needs.prepare-env.outputs.lava-test-plans-repository }}"
#      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
#      lava_action_repository: "${{ needs.prepare-env.outputs.lava-action-repository }}"
#      lava_action_ref: "${{ needs.prepare-env.outputs.lava-action-ref }}"
#      fake_lava_submission: true

  collect-ids:
    name: "Collect Summary artifact IDs"
    needs: [test-nodistro, test-qcom-distro, test-qcom-distro_linux-qcom-6-18]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    outputs:
      summary_ids: ${{ steps.generate-summary.outputs.artifact_ids }}
    steps:
      - name: Summary IDs
        id: generate-summary
        run: |
          echo "artifact_ids=${{ needs.test-nodistro.outputs.summary_id }},${{ needs.test-qcom-distro.outputs.summary_id }},${{ needs.test-qcom-distro_linux-qcom-6-18.outputs.summary_id }}" >> $GITHUB_OUTPUT
