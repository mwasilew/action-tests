name: Tests

on:
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
      pr_number:
        required: false
        type: string
        description: "Pull request number. Recorded in the LAVA job metadata for PR builds"
      pr_url:
        required: false
        type: string
        description: "Pull request URL. Recorded in the LAVA job metadata for PR builds"
    outputs:
      summary_ids:
        description: "IDs of the test summary artifact"
        value: ${{ jobs.collect-ids.outputs.summary_ids }}

env:
  # CalVer tag in qcom-linux-testkit repository (format: testkit-YYYY.MM.DD)
  TESTKIT_REF: "testkit-2026.06.21"

jobs:
  prepare-env:
    name: Prepare environment
    runs-on: ubuntu-latest
    steps:
      - name: "Print ref"
        shell: bash
        run: |
          echo "qcom-linux-testkit ref: ${{ env.TESTKIT_REF }}"
    outputs:
      testkit-ref: "${{ env.TESTKIT_REF }}"

  # The distro test pipeline lives in qcom-reusable-workflows. The revisions
  # of lava-test-plans and of the submission action are pinned by that
  # workflow, so they are selected here by the ref it is called with.
  test-nodistro:
    needs: [prepare-env]
    name: "Test nodistro"
    uses: mwasilew/qcom-reusable-workflows/.github/workflows/reusable-test-distro.yml@reusable-test-workflow
    secrets: inherit
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "iq-8275-evk,iq-9075-evk,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,dragonboard-410c,dragonboard-820c,rb1-core-kit"
      project_name: "meta-qcom"
      distro_name: "nodistro"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"
  test-qcom-distro:
    needs: [prepare-env]
    name: "Test qcom-distro"
    uses: mwasilew/qcom-reusable-workflows/.github/workflows/reusable-test-distro.yml@reusable-test-workflow
    secrets: inherit
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "glymur-crd,iq-8275-evk,iq-9075-evk,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,rb1-core-kit"
      # Limited to two devices: pre-merge renders six test plans per device,
      # so the full list is 42 LAVA jobs per distro. A different pair per
      # distro keeps the coverage wider than the per-distro count suggests.
      devices_premerge: "iq-8275-evk,rb3gen2-core-kit"
      project_name: "meta-qcom"
      distro_name: "qcom-distro"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"
  test-qcom-distro_linux-qcom-6-18:
    needs: [prepare-env]
    name: "Test qcom-distro_linux-qcom-6.18"
    uses: mwasilew/qcom-reusable-workflows/.github/workflows/reusable-test-distro.yml@reusable-test-workflow
    secrets: inherit
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "iq-8275-evk,iq-9075-evk,qcs615-ride,rb3gen2-core-kit,qcs8300-ride-sx,qcs9100-ride-sx,rb1-core-kit"
      # A different pair from the one qcom-distro uses, see above.
      # iq-9075-evk is the meta-qcom machine for the lemans-evk device type.
      devices_premerge: "qcs8300-ride-sx,iq-9075-evk"
      distro_name: "qcom-distro"
      project_name: "meta-qcom"
      distro_suffix: "_linux-qcom-6.18"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"
#  test-debian:
#    needs: [prepare-env]
#    name: "Test debian"
#    uses: mwasilew/qcom-reusable-workflows/.github/workflows/reusable-test-distro.yml@reusable-test-workflow
#    secrets: inherit
#    with:
#      build_id: "${{ inputs.build_id }}"
#      devices: "glymur-crd,qrb2210-rb1,qrb2210-arduino-imola"
#      devices_premerge: "glymur-crd,qrb2210-rb1,qrb2210-arduino-imola"
#      project_name: "qcom-deb-images"
#      distro_name: "debian"
#      os_info: "debian"
#      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
#      pr_number: "${{ inputs.pr_number }}"
#      pr_url: "${{ inputs.pr_url }}"

  collect-ids:
    name: "Collect Summary artifact IDs"
    needs: [test-nodistro, test-qcom-distro, test-qcom-distro_linux-qcom-6-18]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    outputs:
      summary_ids: ${{ steps.generate-summary.outputs.artifact_ids }}
    steps:
      - name: Summary IDs
        id: generate-summary
        run: |
          echo "artifact_ids=${{ needs.test-nodistro.outputs.summary_id }},${{ needs.test-qcom-distro.outputs.summary_id }},${{ needs.test-qcom-distro_linux-qcom-6-18.outputs.summary_id }}" >> $GITHUB_OUTPUT
