# Failures that are known and accepted, applied to the test summary.
#
# Keys are board names as in the LAVA job "machine" metadata, or "*" for every
# board. Each lists test names, either bare or as a mapping with a "comment"
# (usually the issue the failure is tracked in) and an optional "kernels" list
# limiting the entry to some kernel flavours ("default", "linux-qcom-6.18").
# A listed test that passes is reported as an unexpected pass and counted as a
# failure, so stale entries have to be removed.
#
# Pull requests are summarised with the list from the pull request itself.
#
# rb3gen2-core-kit:
#   - test: Audio_Record
#     comment: https://github.com/qualcomm-linux/meta-qcom/issues/1
#     kernels: [linux-qcom-6.18]
#   - Ethernet
"*":
  # testkit-2026.06.21 lacks this test definition, which aborts the
  # pre-merge-basic job
  - Ethernet_Basic_Validation

qcs8300-ride-sx:
  - test: CPUFreq_Validation
    comment: pre-merge-basic aborts, see https://lava.infra.foundries.io/scheduler/job/501675
    kernels: [linux-qcom-6.18]

iq-9075-evk:
  # only listed for the default kernel, so it stays a failure on 6.18
  - test: CPUFreq_Validation
    kernels: [default]
  # passes, so it is reported as an unexpected pass
  - BT_SCAN

rb3gen2-core-kit:
  - test: boot
    comment: login times out after flashing, see https://lava.infra.foundries.io/scheduler/job/501661
